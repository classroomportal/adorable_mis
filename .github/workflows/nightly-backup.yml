name: Nightly database backup

# DIY safety net for the Supabase Free plan, which includes no automatic
# backups at all (see migrations/088_create_db_backups_bucket.sql). Dumps
# roles, schema, and data via the Supabase CLI (its bundled pg_dump matches
# the project's Postgres version, unlike apt's), packages them, and uploads
# to the private db-backups Storage bucket. Backups older than
# RETENTION_DAYS are pruned after each successful upload.
#
# Requires two repo secrets (Settings > Secrets and variables > Actions),
# neither of which this workflow or Claude can create:
#   SUPABASE_DB_URL          the TRANSACTION POOLER connection string, e.g.
#                             postgresql://postgres.drjtcegtucovhbyfdpbx:[PASSWORD]@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
#                             (dashboard > Connect > Transaction pooler tab).
#                             Must be the pooler, not the direct "db.<ref>.
#                             supabase.co:5432" string Supabase shows first —
#                             GitHub Actions runners have no IPv6, and direct
#                             connections are IPv6-only, so a direct URL here
#                             fails with "Network is unreachable".
#   SUPABASE_SERVICE_ROLE_KEY  the service_role key (Project Settings > API)
#
# To restore: download the backup, `tar xzf`, then
#   psql "$DB_URL" -f roles.sql
#   psql "$DB_URL" -f schema.sql
#   psql "$DB_URL" -f data.sql
# against a fresh/target database (never against production without a
# read-through of what you're about to overwrite first).

on:
  schedule:
    # 01:00 UTC = 02:00 Lagos (WAT is UTC+1 all year, no DST).
    # NOTE: GitHub queues scheduled runs on shared runners and has been
    # delivering this one ~5 hours late, so the backup actually lands in
    # the morning rather than at 02:00. The time below is the earliest
    # GitHub will consider running it, not a guarantee.
    - cron: '0 1 * * *'
  workflow_dispatch: {}

env:
  PROJECT_URL: https://drjtcegtucovhbyfdpbx.supabase.co

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema, and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --data-only --use-copy

      - name: Package with a UTC timestamp
        id: pkg
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          file="backup-${stamp}.tar.gz"
          tar -czf "$file" -C backup roles.sql schema.sql data.sql
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload to the private db-backups bucket
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            "$PROJECT_URL/storage/v1/object/db-backups/${{ steps.pkg.outputs.file }}" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${{ steps.pkg.outputs.file }}"

      # Tiered retention, per docs/BACKUP_POLICY.md: recent days in full, then
      # Sundays, then month-firsts. A flat window loses the ability to go back
      # to before a data error that nobody spotted for a term.
      - name: Apply the retention schedule
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAILY_DAYS: '14'
          WEEKLY_WEEKS: '8'
          MONTHLY_MONTHS: '12'
        run: ./scripts/prune-backups.sh
